spring:
  datasource:
    url: jdbc:mysql://localhost:3308/study_platform_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: study_test
    password: study_test_password
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      # MySQL 테스트 연결의 기본 행 잠금 대기 시간
      connection-init-sql: "SET SESSION innodb_lock_wait_timeout = 5"

  jpa:
    hibernate:
      # 테스트에서도 실제 마이그레이션으로 만들어진 스키마를 검증
      ddl-auto: validate

  flyway:
    enabled: true
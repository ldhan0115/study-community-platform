spring:
  profiles:
    # 명시적으로 지정한 프로필이 없으면 local 사용
    default: local

  jpa:
    hibernate:
      # 테이블 생성·변경은 Flyway가 담당
      ddl-auto: validate
    show-sql: false

  sql:
    init:
      # schema.sql, data.sql 자동 실행과 혼용하지 않음
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/migration/mysql

    # 실수로 Flyway clean을 수행하지 않도록 설정
    clean-disabled: true

    # 기존 테이블을 자동으로 기준 스키마로 간주하지 않음
    baseline-on-migrate: false

app:
  seed:
    # 샘플 데이터는 필요할 때 명시적으로 활성화
    enabled: false

logging:
  level:
    org.hibernate.SQL: info

    # 비밀번호·이메일 등 바인딩 값이 로그에 기록되지 않도록 설정
    org.hibernate.orm.jdbc.bind: "OFF"
    org.hibernate.orm.jdbc.extract: "OFF"

server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
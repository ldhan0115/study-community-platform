spring:
  profiles:
    active: local

  datasource:
    url: jdbc:h2:tcp://localhost/~/study-platform
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
logging.level:
  org.hibernate.SQL: debug
  org.hibernate.orm.jdbc.bind: trace


server:
  servlet:
    session:
      timeout: 30m # 세션 타임 아웃 30분
      tracking-modes: cookie # URL에 jsessionid 노출 방지
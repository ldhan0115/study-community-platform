<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle} ?: 'Study Community Platform'">Study Community Platform</title>
  <link rel="stylesheet" th:href="@{/vendor/bootstrap-5.3.8-dist/css/bootstrap.min.css}" href="../vendor/bootstrap-5.3.8-dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/app.css}" href="../css/app.css">

</head>
<body>

<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
  <div class="container py-2">
    <a class="navbar-brand fw-semibold d-flex align-items-center gap-2" th:href="@{/}" href="../index.html">
      <span class="brand-dot"></span>
      <span>Study Community Platform</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        <li class="nav-item"><a class="nav-link" th:href="@{/studies}" href="../studies/index.html">스터디</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/posts}" href="../posts/index.html">커뮤니티</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/applications}" href="../applications/index.html">신청내역</a></li>
        <li class="nav-item"><a class="btn btn-outline-primary btn-sm" th:href="@{/members/login}" href="../members/login.html">로그인</a></li>
        <li class="nav-item"><a class="btn btn-primary btn-sm" th:href="@{/members/signup}" href="../members/signup.html">회원가입</a></li>
      </ul>
    </div>
  </div>
</nav>


<main class="container py-5">
  <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3 mb-4">
    <div><h1 class="h2 section-title mb-1">커뮤니티 게시글</h1><p class="text-secondary mb-0">학습 기록, 질문, 정보 공유를 위한 게시판입니다.</p></div>
    <a class="btn btn-primary" th:href="@{/posts/new}" href="../posts/form.html">게시글 작성</a>
  </div>
  <section class="card soft-card overflow-hidden">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead class="table-light"><tr><th style="width:10%">번호</th><th>제목</th><th style="width:18%">작성자</th><th style="width:20%">작성일</th></tr></thead>
        <tbody th:if="${posts != null and !#lists.isEmpty(posts)}">
          <tr th:each="post : ${posts}">
            <td th:text="${post.id}">1</td>
            <td><a class="link-dark link-underline link-underline-opacity-0" th:href="@{/posts/{id}(id=${post.id})}" href="#" th:text="${post.title} ?: 'Spring Boot 예외 처리 정리'">제목</a></td>
            <td th:text="${post.member.nickname} ?: '코딩하는감자'">작성자</td>
            <td th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd HH:mm')} ?: '2026.03.20 20:00'">날짜</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="p-5 text-center empty-state m-3" th:unless="${posts != null and !#lists.isEmpty(posts)}">
      <h2 class="h5">아직 게시글이 없습니다.</h2>
      <p class="text-secondary mb-0">첫 게시글을 작성해서 커뮤니티 흐름을 연결해보세요.</p>
    </div>
  </section>
</main>


<footer class="container py-5">
  <div class="d-flex flex-column flex-md-row justify-content-between gap-2 border-top pt-4 footer-note">
    <span>개인 프로젝트 UI 시안 · Spring MVC / Thymeleaf 템플릿 연결용</span>
    <span>Bootstrap 5.3.8 기반 화면</span>
  </div>
</footer>

<script th:src="@{/vendor/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js}" src="../vendor/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

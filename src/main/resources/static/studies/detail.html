<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle} ?: 'Study Community Platform'">Study Community Platform</title>
  <link rel="stylesheet" th:href="@{/vendor/bootstrap-5.3.8-dist/css/bootstrap.min.css}" href="../vendor/bootstrap-5.3.8-dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/app.css}" href="../css/app.css">

</head>
<body>

<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
  <div class="container py-2">
    <a class="navbar-brand fw-semibold d-flex align-items-center gap-2" th:href="@{/}" href="../index.html">
      <span class="brand-dot"></span>
      <span>Study Community Platform</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        <li class="nav-item"><a class="nav-link" th:href="@{/studies}" href="../studies/index.html">스터디</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/posts}" href="../posts/index.html">커뮤니티</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/applications}" href="../applications/index.html">신청내역</a></li>
        <li class="nav-item"><a class="btn btn-outline-primary btn-sm" th:href="@{/members/login}" href="../members/login.html">로그인</a></li>
        <li class="nav-item"><a class="btn btn-primary btn-sm" th:href="@{/members/signup}" href="../members/signup.html">회원가입</a></li>
      </ul>
    </div>
  </div>
</nav>


<main class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <a class="btn btn-outline-secondary" th:href="@{/studies}" href="../studies/index.html">목록으로</a>
    <div class="d-flex gap-2">
      <a class="btn btn-outline-primary" th:href="@{/studies/{id}/edit(id=${study.id})}" href="#">수정</a>
      <form method="post" th:action="@{/studies/{id}/delete(id=${study.id})}" action="#"><button class="btn btn-outline-danger" type="submit">삭제</button></form>
    </div>
  </div>
  <section class="card soft-card"><div class="card-body p-4 p-lg-5">
    <div class="d-flex flex-wrap gap-2 mb-3">
      <span class="badge text-bg-light border" th:text="${study.method} ?: 'ONLINE'">ONLINE</span>
      <span class="badge text-bg-success" th:if="${study.studyStatus.name() == 'OPEN'}">모집중</span>
      <span class="badge text-bg-secondary" th:if="${study.studyStatus.name() == 'CLOSED'}">마감</span>
    </div>
    <h1 class="section-title mb-2" th:text="${study.title} ?: '백엔드 취업 준비 스터디'">백엔드 취업 준비 스터디</h1>
    <div class="meta-inline mb-4 d-flex flex-column gap-1">
      <span th:text="|개설자 ${study.member.nickname}|">개설자 코딩하는감자</span>
      <span th:text="|정원 ${study.capacity}명|">정원 6명</span>
      <span th:text="${study.region != null ? '지역 ' + study.region : '지역 온라인'}">지역 온라인</span>
      <span th:text="|등록일 ${#temporals.format(study.createdAt, 'yyyy.MM.dd HH:mm')}|">등록일</span>
    </div>
    <div class="content-box border rounded-4 p-4 bg-body-tertiary" th:text="${study.content} ?: '스터디 소개 내용이 표시됩니다.'">스터디 소개 내용</div>
    <div class="d-flex flex-wrap gap-2 mt-4">
      <a class="btn btn-primary" th:if="${study.studyStatus.name() == 'OPEN'}" th:href="@{/applications/new(studyId=${study.id})}" href="#">스터디 신청하기</a>
      <button class="btn btn-secondary" type="button" disabled th:if="${study.studyStatus.name() == 'CLOSED'}">모집 마감</button>
    </div>
  </div></section>
</main>


<footer class="container py-5">
  <div class="d-flex flex-column flex-md-row justify-content-between gap-2 border-top pt-4 footer-note">
    <span>개인 프로젝트 UI 시안 · Spring MVC / Thymeleaf 템플릿 연결용</span>
    <span>Bootstrap 5.3.8 기반 화면</span>
  </div>
</footer>

<script th:src="@{/vendor/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js}" src="../vendor/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스터디 상세 보기 - Study Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        :root { --brand-color: #0d6efd; }
        body { background-color: #f8f9fa; }

        .nav-link { font-weight: 500; color: #495057; transition: 0.2s; }
        .nav-link:hover { color: var(--brand-color); }

        .dropdown-hover { position: relative; }
        .dropdown-hover:hover .dropdown-menu { display: block; }
        .dropdown-hover .dropdown-menu { top: 100%; right: 0; left: auto; margin-top: 5px; }
        .dropdown-hover .dropdown-menu::before { content: ''; position: absolute; top: -10px; left: 0; width: 100%; height: 10px; background-color: transparent; }

        .study-container { max-width: 900px; margin: 40px auto; }
        .info-box { background-color: #f8f9fa; border-radius: 0.5rem; padding: 1.5rem; border: 1px solid #e9ecef; }

        /* 텍스트 줄바꿈 유지 */
        .study-content {
            white-space: pre-wrap;
            line-height: 1.8;
            font-size: 1.05rem;
            color: #343a40;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom">
    <div class="container py-1">
        <a class="navbar-brand fw-bold text-primary fs-4" th:href="@{/}">StudyPlatform</a>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item"><a class="nav-link text-primary fw-bold" th:href="@{/studies}">스터디 탐색</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/posts}">커뮤니티</a></li>
                <li class="nav-item" th:if="${session.loginMember != null}">
                    <a class="nav-link" th:href="@{/applications}">내 신청내역</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3">
                <th:block th:if="${session.loginMember == null}">
                    <a class="text-decoration-none text-secondary small" th:href="@{/members/login}">로그인</a>
                    <a class="btn btn-primary px-4 rounded-pill" th:href="@{/members/join}">시작하기</a>
                </th:block>
                <th:block th:if="${session.loginMember != null}">
                    <div class="dropdown dropdown-hover d-flex align-items-center">
                        <span class="fw-bold small text-dark pe-2 py-2" style="cursor: pointer;" th:text="|${session.loginMember.nickname}님|">사용자님</span>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">
                            <li><a class="dropdown-item py-2" th:href="@{/members/edit}">정보 수정</a></li>
                            <li>
                                <form th:action="@{/members/logout}" method="post" class="m-0">
                                    <button type="submit" class="dropdown-item py-2">로그아웃</button>
                                </form>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/members/delete}" method="post" class="m-0" onsubmit="return confirm('정말 탈퇴하시겠습니까?');">
                                    <button type="submit" class="dropdown-item py-2 text-danger fw-bold">회원 탈퇴</button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </th:block>
            </div>
        </div>
    </div>
</nav>

<main class="container">
    <div class="study-container">

        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 p-md-5">

                <div class="border-bottom pb-4 mb-4">
                    <div class="d-flex align-items-center gap-2 mb-3">
                        <span class="badge bg-primary-subtle text-primary px-3 py-2 rounded-pill">모집중</span>
                        <span class="badge bg-light text-secondary border px-3 py-2 rounded-pill" th:text="${study.method.name() == 'ONLINE' ? '온라인' : (study.method.name() == 'OFFLINE' ? '오프라인' : '온/오프라인 혼합')}">온라인</span>
                    </div>

                    <h2 class="fw-bold mb-4" th:text="${study.title}">스프링 핵심 원리 스터디원 모집합니다</h2>

                    <div class="d-flex justify-content-between align-items-center text-muted small">
                        <div class="d-flex align-items-center gap-2">
                            <div class="bg-secondary text-white rounded-circle d-flex justify-content-center align-items-center fw-bold" style="width: 32px; height: 32px;" th:text="${#strings.substring(study.member.nickname, 0, 1)}">홍</div>
                            <span class="fw-medium text-dark" th:text="${study.member.nickname}">홍길동</span>
                            <span class="mx-2">|</span>
                            <i class="bi bi-clock"></i> <span th:text="${#temporals.format(study.createdAt, 'yyyy-MM-dd HH:mm')}">2026-04-19 14:30</span>
                        </div>
                    </div>
                </div>

                <div class="info-box mb-5">
                    <div class="row text-center g-4">
                        <div class="col-4 border-end">
                            <p class="text-muted mb-1 small fw-bold">모집 인원</p>
                            <h5 class="fw-bold mb-0 text-dark"><span th:text="${study.capacity}">4</span><span class="fs-6 fw-normal text-muted">명</span></h5>
                        </div>
                        <div class="col-4 border-end">
                            <p class="text-muted mb-1 small fw-bold">진행 방식</p>
                            <h5 class="fw-bold mb-0 text-dark" th:text="${study.method.name() == 'ONLINE' ? '온라인' : (study.method.name() == 'OFFLINE' ? '오프라인' : '혼합')}">온라인</h5>
                        </div>
                        <div class="col-4">
                            <p class="text-muted mb-1 small fw-bold">진행 지역</p>
                            <h5 class="fw-bold mb-0 text-dark" th:text="${study.region}">서울 강남구</h5>
                        </div>
                    </div>
                </div>

                <div class="mb-5">
                    <h5 class="fw-bold mb-4 text-primary"><i class="bi bi-card-text me-2"></i>스터디 소개</h5>
                    <div class="study-content" th:text="${study.content}">
                        여기에 스터디 상세 내용이 출력됩니다.
                        줄바꿈도 CSS 속성에 의해 정상적으로 반영됩니다.
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center border-top pt-4">
                    <a th:href="@{/studies}" class="btn btn-outline-secondary px-4 fw-medium">
                        <i class="bi bi-list me-1"></i>목록으로
                    </a>

                    <div class="d-flex gap-2">
                        <th:block th:if="${session.loginMember != null and session.loginMember.id == study.member.id}">
                            <a th:href="@{|/studies/${study.id}/edit|}" class="btn btn-light border px-4 fw-medium text-dark">수정</a>
                            <form th:action="@{|/studies/${study.id}/delete|}" method="post" class="m-0" onsubmit="return confirm('이 스터디 모집 글을 삭제하시겠습니까?');">
                                <button type="submit" class="btn btn-danger px-4 fw-medium">삭제</button>
                            </form>
                        </th:block>

                        <th:block th:if="${session.loginMember == null or session.loginMember.id != study.member.id}">
                            <a href="#" class="btn btn-primary px-5 fw-bold shadow-sm" onclick="alert('스터디 신청 기능은 준비 중입니다.'); return false;">신청하기</a>
                        </th:block>
                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<footer class="py-5 mt-5">
    <div class="container text-center text-muted small">
        &copy; 2026 Study Community Platform. All rights reserved.
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스터디 탐색 - Study Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        :root { --brand-color: #0d6efd; }
        body { background-color: #f8f9fa; }

        .nav-link { font-weight: 500; color: #495057; transition: 0.2s; }
        .nav-link:hover { color: var(--brand-color); }

        .dropdown-hover { position: relative; }
        .dropdown-hover:hover .dropdown-menu { display: block; }
        .dropdown-hover .dropdown-menu { top: 100%; right: 0; left: auto; margin-top: 5px; }
        .dropdown-hover .dropdown-menu::before { content: ''; position: absolute; top: -10px; left: 0; width: 100%; height: 10px; background-color: transparent; }

        /* 스터디 카드 호버 애니메이션 및 클릭 커서 */
        .study-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid rgba(0,0,0,0.08);
            cursor: pointer;
        }
        .study-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.08) !important;
        }

        /* 카드 내용 줄임표 처리 (2줄 초과 시 ...) */
        .card-text-clamp {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom">
    <div class="container py-1">
        <a class="navbar-brand fw-bold text-primary fs-4" th:href="@{/}">StudyPlatform</a>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item"><a class="nav-link text-primary fw-bold" th:href="@{/studies}">스터디 탐색</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/posts}">커뮤니티</a></li>
                <li class="nav-item" th:if="${session.loginMember != null}">
                    <a class="nav-link" th:href="@{/applications}">내 신청내역</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3">
                <th:block th:if="${session.loginMember == null}">
                    <a class="text-decoration-none text-secondary small" th:href="@{/members/login}">로그인</a>
                    <a class="btn btn-primary px-4 rounded-pill" th:href="@{/members/join}">시작하기</a>
                </th:block>
                <th:block th:if="${session.loginMember != null}">
                    <div class="dropdown dropdown-hover d-flex align-items-center">
                        <span class="fw-bold small text-dark pe-2 py-2" style="cursor: pointer;" th:text="|${session.loginMember.nickname}님|">사용자님</span>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">
                            <li><a class="dropdown-item py-2" th:href="@{/members/edit}">정보 수정</a></li>
                            <li>
                                <form th:action="@{/members/logout}" method="post" class="m-0">
                                    <button type="submit" class="dropdown-item py-2">로그아웃</button>
                                </form>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/members/delete}" method="post" class="m-0" onsubmit="return confirm('정말 탈퇴하시겠습니까? 삭제된 계정은 복구할 수 없습니다.');">
                                    <button type="submit" class="dropdown-item py-2 text-danger fw-bold">회원 탈퇴</button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </th:block>
            </div>
        </div>
    </div>
</nav>

<main class="container py-5">

    <div class="row align-items-end mb-4">
        <div class="col-md-6 mb-3 mb-md-0">
            <h2 class="fw-bold mb-2">스터디 탐색</h2>
            <p class="text-muted mb-0">함께 성장할 최적의 동료를 찾아보세요.</p>
        </div>
        <div class="col-md-6 d-flex justify-content-md-end">
            <a th:href="@{/studies/new}" class="btn btn-primary fw-medium px-4 shadow-sm">스터디 개설</a>
        </div>
    </div>

    <div th:if="${studies.empty}" class="text-center py-5 my-5">
        <i class="bi bi-folder-x display-1 text-muted mb-3"></i>
        <h4 class="fw-bold text-secondary">등록된 스터디가 없습니다.</h4>
        <p class="text-muted">첫 번째 스터디의 주인공이 되어보세요!</p>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mb-5" th:unless="${studies.empty}">

        <div class="col" th:each="study : ${studies}">
            <div class="card h-100 study-card rounded-4 bg-white shadow-sm p-2" th:onclick="|location.href='@{/studies/{studyId}(studyId=${study.id})}'|">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <span class="badge bg-primary-subtle text-primary rounded-pill px-2 py-1"
                              th:text="${study.method.name() == 'ONLINE' ? '온라인' : (study.method.name() == 'OFFLINE' ? '오프라인' : '온/오프라인')}">온라인</span>

                        <small class="text-muted" th:text="${#temporals.format(study.createdAt, 'MM-dd')}">04-19</small>
                    </div>

                    <h5 class="card-title fw-bold mb-3" th:text="${study.title}">스터디 제목</h5>

                    <p class="card-text text-secondary small mb-4 card-text-clamp" th:text="${study.content}">
                        스터디 내용 요약...
                    </p>

                    <div class="d-flex flex-wrap gap-1 mb-3">
                        <span class="badge bg-light text-secondary border"><i class="bi bi-geo-alt-fill me-1"></i><th:block th:text="${study.region}">지역</th:block></span>
                    </div>
                </div>

                <div class="card-footer bg-transparent border-top-0 px-3 pb-3 pt-0 d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-2 small">
                        <div class="bg-secondary text-white rounded-circle d-flex justify-content-center align-items-center" style="width: 24px; height: 24px; font-size: 10px;" th:text="${#strings.substring(study.member.nickname, 0, 1)}">홍</div>
                        <span class="fw-medium text-dark" th:text="${study.member.nickname}">작성자</span>
                    </div>
                    <div class="text-muted small fw-medium">
                        <i class="bi bi-people-fill text-primary"></i> <span th:text="|${study.capacity}명 모집|">4명 모집</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

</main>

<footer class="py-4 border-top bg-white mt-auto">
    <div class="container">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-2 text-muted small">
            <div>&copy; 2026 Study Community Platform.</div>
            <div class="fw-medium text-secondary">Java 17 · Spring Boot 3.2 · JPA · MySQL</div>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Study Platform'">Study Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        :root { --brand-color: #0d6efd; }
        body { background-color: #ffffff; }

        .hero-full {
            min-height: calc(85vh - 72px);
            display: flex;
            align-items: center;
            background: radial-gradient(circle at top right, #f8faff 0%, #ffffff 100%);
        }

        .nav-link { font-weight: 500; color: #495057; transition: 0.2s; }
        .nav-link:hover { color: var(--brand-color); }

        .main-title { letter-spacing: -0.05rem; line-height: 1.2; }
        .main-description { line-height: 1.8; color: #6c757d; }

        /* 드롭다운 부모 요소 상대 위치 지정 */
        .dropdown-hover {
            position: relative;
        }

        /* 마우스 호버 시 드롭다운 표시 */
        .dropdown-hover:hover .dropdown-menu {
            display: block;
        }

        /* 드롭박스를 마우스(닉네임) 바로 아래에 고정 */
        .dropdown-hover .dropdown-menu {
            top: 100%;
            right: 0;
            left: auto;
            margin-top: 5px; /* 닉네임과의 간격 조절 */
        }

        /* 닉네임과 드롭다운 사이의 틈(Dead Zone)에서 마우스 호버가 풀리지 않도록 투명 다리 생성 */
        .dropdown-hover .dropdown-menu::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 0;
            width: 100%;
            height: 10px;
            background-color: transparent;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom">
    <div class="container py-1">
        <a class="navbar-brand fw-bold text-primary fs-4" th:href="@{/}">StudyPlatform</a>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item"><a class="nav-link" th:href="@{/studies}">스터디 탐색</a></li>
                <li class="nav-item" th:if="${session.loginMember != null}">
                    <a class="nav-link" th:href="@{/applications}">내 신청내역</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3">
                <th:block th:if="${session.loginMember == null}">
                    <a class="text-decoration-none text-secondary small" th:href="@{/members/login}">로그인</a>
                    <a class="btn btn-primary px-4 rounded-pill" th:href="@{/members/join}">시작하기</a>
                </th:block>
                <th:block th:if="${session.loginMember != null}">
                    <div class="dropdown dropdown-hover d-flex align-items-center">
                        <span class="fw-bold small text-dark pe-2 py-2" style="cursor: pointer;" th:text="|${session.loginMember.nickname}님|">사용자님</span>

                        <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">
                            <li><a class="dropdown-item py-2" th:href="@{/members/edit}">정보 수정</a></li>
                            <li>
                                <form th:action="@{/members/logout}" method="post" class="m-0">
                                    <button type="submit" class="dropdown-item py-2">로그아웃</button>
                                </form>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/members/withdraw}" method="post" class="m-0" onsubmit="return confirm('정말 탈퇴하시겠습니까? 삭제된 계정은 복구할 수 없습니다.');">
                                    <button type="submit" class="dropdown-item py-2 text-danger fw-bold">회원 탈퇴</button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </th:block>
            </div>
        </div>
    </div>
</nav>

<main class="hero-full">
    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div class="mb-4">
                    <span class="badge rounded-pill bg-primary-subtle text-primary px-4 py-2 small fw-bold">
                        Portfolio Project
                    </span>
                </div>

                <h1 class="display-3 fw-bold main-title mb-4">
                    성장하는 인재를 위한 <br>
                    <span class="text-primary font-monospace">Study Community</span>
                </h1>

                <p class="fs-5 main-description mb-5 px-lg-5">
                    지금 동료를 찾고 지식을 공유해 보세요.
                </p>

                <div class="d-flex flex-column flex-md-row justify-content-center gap-3">
                    <a class="btn btn-primary btn-lg px-5 py-3 rounded-pill shadow-lg fw-bold" th:href="@{/studies}">
                        스터디 바로가기
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="py-4 border-top">
    <div class="container">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-2 text-muted small">
            <div>&copy; 2026 Study Community Platform.</div>
            <div class="fw-medium text-secondary">Java 17 · Spring Boot 3.2 · JPA · MySQL</div>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle} ?: 'Join - Study Platform'">회원가입</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <style>
    body { background-color: #f8f9fa; }
    .join-card {
        border: none;
        border-radius: 1.5rem;
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05);
    }
    .form-label { font-weight: 600; color: #495057; font-size: 0.9rem; }
    .form-control { padding: 0.75rem 1rem; border-radius: 0.75rem; border: 1px solid #dee2e6; }
    .form-control:focus { box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.1); }
    /* 검증 오류 시 스타일 */
    .is-invalid { border-color: #dc3545 !important; }
    .invalid-feedback { font-size: 0.8rem; margin-top: 0.35rem; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
  <div class="container py-1">
    <a class="navbar-brand fw-bold text-primary fs-4" th:href="@{/}">StudyPlatform</a>
  </div>
</nav>

<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-8">
      <div class="card join-card">
        <div class="card-body p-4 p-lg-5">
          <div class="text-center mb-5">
            <h1 class="fw-bold h2 mb-2">시작하기</h1>
            <p class="text-muted">함께 성장할 준비가 되셨나요?</p>
          </div>

          <form th:action="@{/members/join}" th:object="${member}" method="post">

            <div class="mb-4">
              <label class="form-label" th:for="loginId">아이디</label>
              <input type="text" th:field="*{loginId}"
                     class="form-control"
                     th:classappend="${#fields.hasErrors('loginId')} ? 'is-invalid'"
                     placeholder="영문, 숫자 4자 이상">
              <div class="invalid-feedback" th:errors="*{loginId}">아이디 오류 메시지</div>
            </div>

            <div class="mb-4">
              <label class="form-label" th:for="nickname">닉네임</label>
              <input type="text" th:field="*{nickname}"
                     class="form-control"
                     th:classappend="${#fields.hasErrors('nickname')} ? 'is-invalid'"
                     placeholder="커뮤니티에서 사용할 이름">
              <div class="invalid-feedback" th:errors="*{nickname}">닉네임 오류 메시지</div>
            </div>

            <div class="mb-4">
              <label class="form-label" th:for="email">이메일</label>
              <input type="email" th:field="*{email}"
                     class="form-control"
                     th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                     placeholder="example@study.com">
              <div class="invalid-feedback" th:errors="*{email}">이메일 오류 메시지</div>
            </div>

            <div class="mb-5">
              <label class="form-label" th:for="password">비밀번호</label>
              <input type="password" th:field="*{password}"
                     class="form-control"
                     th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                     placeholder="8자 이상 입력해주세요">
              <div class="invalid-feedback" th:errors="*{password}">비밀번호 오류 메시지</div>
            </div>

            <div class="d-grid gap-2">
              <button class="btn btn-primary btn-lg fw-bold rounded-pill mb-2" type="submit">
                회원가입 완료
              </button>
              <a class="btn btn-link text-decoration-none text-muted btn-sm" th:href="@{/members/login}">
                이미 계정이 있으신가요? 로그인
              </a>
            </div>
          </form>
        </div>
      </div>

      <div class="text-center mt-4">
        <a th:href="@{/}" class="text-decoration-none small text-secondary">
          <i class="bi bi-arrow-left"></i> 홈으로 돌아가기
        </a>
      </div>
    </div>
  </div>
</main>

<footer class="py-4 mt-auto">
  <div class="container text-center text-muted small">
    <p>&copy; 2026 Study Community Platform. Built with Spring Boot & JPA.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle} ?: 'Study Community Platform'">Study Community Platform</title>

  <link rel="stylesheet"
        th:href="@{/vendor/bootstrap-5.3.8-dist/css/bootstrap.min.css}"
        href="/vendor/bootstrap-5.3.8-dist/css/bootstrap.min.css">
  <link rel="stylesheet"
        th:href="@{/css/app.css}"
        href="/css/app.css">

  <style>
    .field-error {
      border-color: #dc3545;
      color: #dc3545;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
  <div class="container py-2">
    <a class="navbar-brand fw-semibold d-flex align-items-center gap-2"
       th:href="@{/}" href="/">
      <span class="brand-dot"></span>
      <span>Study Community Platform</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/studies}" href="/studies">스터디</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/posts}" href="/posts">커뮤니티</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/applications}" href="/applications">신청내역</a>
        </li>
        <li class="nav-item">
          <a class="btn btn-outline-primary btn-sm" th:href="@{/members/login}" href="/members/login">로그인</a>
        </li>
        <li class="nav-item">
          <a class="btn btn-primary btn-sm" th:href="@{/members/join}" href="/members/join">회원가입</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
      <section class="card soft-card">
        <div class="card-body p-4 p-lg-5">
          <div class="text-center mb-4">
            <h1 class="h3 section-title mb-2">회원가입</h1>
            <p class="text-secondary mb-0">스터디 커뮤니티 플랫폼에 가입하고 다양한 기능을 이용해보세요.</p>
          </div>

          <form class="row g-3"
                th:action="@{/members/join}"
                th:object="${member}"
                method="post">

            <div class="col-12">
              <label class="form-label" for="loginId">아이디</label>
              <input id="loginId"
                     class="form-control"
                     th:errorClass="field-error"
                     type="text"
                     th:field="*{loginId}"
                     placeholder="4자 이상">
              <div class="field-error" th:errors="*{loginId}"></div>
            </div>

            <div class="col-12">
              <label class="form-label" for="nickname">닉네임</label>
              <input id="nickname"
                     class="form-control"
                     th:errorClass="field-error"
                     type="text"
                     th:field="*{nickname}"
                     placeholder="닉네임">
              <div class="field-error" th:errors="*{nickname}"></div>
            </div>

            <div class="col-12">
              <label class="form-label" for="email">이메일</label>
              <input id="email"
                     class="form-control"
                     th:errorClass="field-error"
                     type="email"
                     th:field="*{email}"
                     placeholder="example@gmail.com">
              <div class="field-error" th:errors="*{email}"></div>
            </div>

            <div class="col-12">
              <label class="form-label" for="password">비밀번호</label>
              <input id="password"
                     class="form-control"
                     th:errorClass="field-error"
                     type="password"
                     th:field="*{password}"
                     placeholder="비밀번호">
              <div class="field-error" th:errors="*{password}"></div>
            </div>

            <div class="col-12 d-flex gap-2 justify-content-end">
              <a class="btn btn-outline-secondary"
                 th:href="@{/members/login}"
                 href="/members/login">취소</a>
              <button class="btn btn-primary" type="submit">회원가입</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </div>
</main>

<footer class="container py-5">
  <div class="d-flex flex-column flex-md-row justify-content-between gap-2 border-top pt-4 footer-note">
    <span>개인 프로젝트 UI 시안 · Spring MVC / Thymeleaf 템플릿 연결용</span>
    <span>Bootstrap 5.3.8 기반 화면</span>
  </div>
</footer>

<script th:src="@{/vendor/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js}"
        src="/vendor/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

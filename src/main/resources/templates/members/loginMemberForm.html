<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle} ?: 'Study Community Platform'">Study Community Platform</title>

  <link rel="stylesheet"
        th:href="@{/vendor/bootstrap-5.3.8-dist/css/bootstrap.min.css}"
        href="/vendor/bootstrap-5.3.8-dist/css/bootstrap.min.css">
  <link rel="stylesheet"
        th:href="@{/css/app.css}"
        href="/css/app.css">

  <style>
    .field-error {
      border-color: #dc3545;
      color: #dc3545;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
  <div class="container py-2">
    <a class="navbar-brand fw-semibold d-flex align-items-center gap-2"
       th:href="@{/}" href="/">
      <span class="brand-dot"></span>
      <span>Study Community Platform</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        <li class="nav-item"><a class="nav-link" th:href="@{/studies}" href="/studies">스터디</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/posts}" href="/posts">커뮤니티</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/applications}" href="/applications">신청내역</a></li>
        <li class="nav-item"><a class="btn btn-outline-primary btn-sm" th:href="@{/members/login}" href="/members/login">로그인</a></li>
        <li class="nav-item"><a class="btn btn-primary btn-sm" th:href="@{/members/join}" href="/members/join">회원가입</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
      <section class="card soft-card">
        <div class="card-body p-4 p-lg-5">
          <div class="text-center mb-4">
            <h1 class="h3 section-title mb-2">로그인</h1>
            <p class="text-secondary mb-0">아이디와 비밀번호를 입력해주세요.</p>
          </div>

          <form class="vstack gap-3"
                method="post"
                th:action="@{/members/login}"
                th:object="${member}">

            <!-- 글로벌 에러 -->
            <div th:if="${#fields.hasGlobalErrors()}">
              <p class="field-error"
                 th:each="err : ${#fields.globalErrors()}"
                 th:text="${err}">
                전체 오류 메시지
              </p>
            </div>

            <div>
              <label class="form-label" for="loginId">아이디</label>
              <input id="loginId"
                     class="form-control"
                     type="text"
                     th:field="*{loginId}"
                     th:errorClass="field-error"
                     placeholder="loginId">
              <div class="field-error" th:errors="*{loginId}"></div>
            </div>

            <div>
              <label class="form-label" for="password">비밀번호</label>
              <input id="password"
                     class="form-control"
                     type="password"
                     th:field="*{password}"
                     th:errorClass="field-error"
                     placeholder="password">
              <div class="field-error" th:errors="*{password}"></div>
            </div>

            <button class="btn btn-primary w-100" type="submit">로그인</button>
            <a class="btn btn-outline-secondary w-100"
               th:href="@{/members/join}"
               href="/members/join">회원가입</a>
          </form>
        </div>
      </section>
    </div>
  </div>
</main>

<footer class="container py-5">
  <div class="d-flex flex-column flex-md-row justify-content-between gap-2 border-top pt-4 footer-note">
    <span>개인 프로젝트 UI 시안 · Spring MVC / Thymeleaf 템플릿 연결용</span>
    <span>Bootstrap 5.3.8 기반 화면</span>
  </div>
</footer>

<script th:src="@{/vendor/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js}"
        src="/vendor/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

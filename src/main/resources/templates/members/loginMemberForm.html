<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle} ?: 'Login - Study Platform'">로그인</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <style>
    body { background-color: #fcfcfc; }
    .login-container { min-height: 80vh; display: flex; align-items: center; }
    .login-card {
        border: none;
        border-radius: 1.5rem;
        box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    }
    .form-control {
        padding: 0.8rem 1rem;
        border-radius: 0.75rem;
        border: 1px solid #eee;
        background-color: #fdfdfd;
    }
    .form-control:focus {
        box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.05);
        border-color: #0d6efd;
        background-color: #fff;
    }
    .form-label { font-weight: 600; font-size: 0.9rem; color: #495057; }
    .field-error { color: #dc3545; font-size: 0.8rem; margin-top: 0.35rem; }
    .input-error { border-color: #dc3545 !important; background-color: #fff8f8 !important; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
  <div class="container py-2">
    <a class="navbar-brand fw-bold text-primary" th:href="@{/}">StudyPlatform</a>
  </div>
</nav>

<main class="login-container container">
  <div class="row justify-content-center w-100">
    <div class="col-lg-4 col-md-6">
      <div class="card login-card p-4">
        <div class="card-body">
          <div class="text-center mb-4">
            <h1 class="h2 fw-bold mb-2">로그인</h1>
            <p class="text-muted small">계정 정보를 입력해 주세요.</p>
          </div>

          <form th:action="@{/members/login}" th:object="${member}" method="post">

            <div th:if="${#fields.hasGlobalErrors()}"
                 class="alert alert-danger border-0 small py-2 text-center mb-4"
                 style="border-radius: 0.75rem;">
              <span th:each="err : ${#fields.globalErrors()}" th:text="${err}">오류</span>
            </div>

            <div class="mb-3">
              <label class="form-label" th:for="loginId">아이디</label>
              <input type="text" th:field="*{loginId}"
                     class="form-control"
                     th:errorclass="input-error"
                     placeholder="아이디를 입력하세요">
              <div class="field-error" th:errors="*{loginId}">아이디 오류</div>
            </div>

            <div class="mb-4">
              <label class="form-label" th:for="password">비밀번호</label>
              <input type="password" th:field="*{password}"
                     class="form-control"
                     th:errorclass="input-error"
                     placeholder="비밀번호를 입력하세요">
              <div class="field-error" th:errors="*{password}">비밀번호 오류</div>
            </div>

            <div class="vstack gap-2 mt-4">
              <button class="btn btn-primary btn-lg fw-bold rounded-pill" type="submit">로그인</button>
              <a class="btn btn-link text-decoration-none text-muted small mt-2" th:href="@{/members/join}">
                아직 회원이 아니신가요? <strong>회원가입</strong>
              </a>
            </div>
          </form>
        </div>
      </div>

      <div class="text-center mt-4">
        <a th:href="@{/}" class="text-decoration-none small text-secondary">
          홈으로 돌아가기
        </a>
      </div>
    </div>
  </div>
</main>

<footer class="py-4 mt-auto">
  <div class="container text-center text-muted small">
    <p>&copy; 2026 Study Community Platform. Built with Spring Boot & JPA.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

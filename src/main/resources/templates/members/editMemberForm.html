<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Edit Profile - Study Platform'">정보 수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        :root { --brand-color: #0d6efd; }
        body { background-color: #f8f9fa; }

        /* 네비게이션 바 링크 및 호버 드롭다운 CSS 추가 */
        .nav-link { font-weight: 500; color: #495057; transition: 0.2s; }
        .nav-link:hover { color: var(--brand-color); }

        .dropdown-hover { position: relative; }
        .dropdown-hover:hover .dropdown-menu { display: block; }
        .dropdown-hover .dropdown-menu { top: 100%; right: 0; left: auto; margin-top: 5px; }
        .dropdown-hover .dropdown-menu::before { content: ''; position: absolute; top: -10px; left: 0; width: 100%; height: 10px; background-color: transparent; }

        /* 폼 관련 CSS */
        .edit-card {
            border: none;
            border-radius: 1.5rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05);
        }
        .form-label { font-weight: 600; color: #495057; font-size: 0.9rem; }
        .form-control { padding: 0.75rem 1rem; border-radius: 0.75rem; border: 1px solid #dee2e6; }
        .form-control[readonly] { background-color: #e9ecef; cursor: not-allowed; }
        .is-invalid { border-color: #dc3545 !important; }
        .invalid-feedback { font-size: 0.8rem; margin-top: 0.35rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom">
    <div class="container py-1">
        <a class="navbar-brand fw-bold text-primary fs-4" th:href="@{/}">StudyPlatform</a>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item"><a class="nav-link" th:href="@{/studies}">스터디 탐색</a></li>
                <li class="nav-item" th:if="${session.loginMember != null}">
                    <a class="nav-link" th:href="@{/applications}">내 신청내역</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3">
                <th:block th:if="${session.loginMember == null}">
                    <a class="text-decoration-none text-secondary small" th:href="@{/members/login}">로그인</a>
                    <a class="btn btn-primary px-4 rounded-pill" th:href="@{/members/join}">시작하기</a>
                </th:block>
                <th:block th:if="${session.loginMember != null}">
                    <div class="dropdown dropdown-hover d-flex align-items-center">
                        <span class="fw-bold small text-dark pe-2 py-2" style="cursor: pointer;" th:text="|${session.loginMember.nickname}님|">사용자님</span>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">
                            <li><a class="dropdown-item py-2" th:href="@{/members/edit}">정보 수정</a></li>
                            <li>
                                <form th:action="@{/members/logout}" method="post" class="m-0">
                                    <button type="submit" class="dropdown-item py-2">로그아웃</button>
                                </form>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/members/delete}" method="post" class="m-0" onsubmit="return confirm('정말 탈퇴하시겠습니까? 삭제된 계정은 복구할 수 없습니다.');">
                                    <button type="submit" class="dropdown-item py-2 text-danger fw-bold">회원 탈퇴</button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </th:block>
            </div>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-8">
            <div class="card edit-card">
                <div class="card-body p-4 p-lg-5">
                    <div class="text-center mb-5">
                        <h1 class="fw-bold h2 mb-2">정보 수정</h1>
                    </div>

                    <form th:action th:object="${member}" method="post">

                        <div class="mb-4">
                            <label class="form-label" th:for="loginId">아이디</label>
                            <input type="text" th:field="*{loginId}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('loginId')} ? 'is-invalid'"
                                   placeholder="변경할 아이디">
                            <div class="invalid-feedback" th:errors="*{loginId}">아이디 오류 메시지</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" th:for="nickname">닉네임</label>
                            <input type="text" th:field="*{nickname}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('nickname')} ? 'is-invalid'"
                                   placeholder="변경할 닉네임">
                            <div class="invalid-feedback" th:errors="*{nickname}">닉네임 오류 메시지</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" th:for="email">이메일</label>
                            <input type="email" th:field="*{email}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                   placeholder="example@study.com">
                            <div class="invalid-feedback" th:errors="*{email}">이메일 오류 메시지</div>
                        </div>

                        <div class="mb-5">
                            <label class="form-label" th:for="password">비밀번호 변경</label>
                            <input type="password" th:field="*{password}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                   placeholder="새 비밀번호">
                            <div class="invalid-feedback" th:errors="*{password}">비밀번호 오류 메시지</div>
                        </div>

                        <div class="d-grid gap-2">
                            <button class="btn btn-primary btn-lg fw-bold rounded-pill mb-2" type="submit">
                                정보 수정 완료
                            </button>
                            <a class="btn btn-outline-secondary btn-lg fw-bold rounded-pill" th:href="@{/}">
                                취소
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Edit Profile - Study Platform'">정보 수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        body { background-color: #f8f9fa; }
        .edit-card {
            border: none;
            border-radius: 1.5rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05);
        }
        .form-label { font-weight: 600; color: #495057; font-size: 0.9rem; }
        .form-control { padding: 0.75rem 1rem; border-radius: 0.75rem; border: 1px solid #dee2e6; }
        .form-control[readonly] { background-color: #e9ecef; cursor: not-allowed; }
        .is-invalid { border-color: #dc3545 !important; }
        .invalid-feedback { font-size: 0.8rem; margin-top: 0.35rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
    <div class="container py-1">
        <a class="navbar-brand fw-bold text-primary fs-4" th:href="@{/}">StudyPlatform</a>
        <div class="ms-auto d-flex align-items-center gap-3">
            <span class="fw-bold small text-dark" th:text="|${session.loginMember.nickname}님|">사용자님</span>
            <a th:href="@{/}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">홈으로</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-8">
            <div class="card edit-card">
                <div class="card-body p-4 p-lg-5">
                    <div class="text-center mb-5">
                        <h1 class="fw-bold h2 mb-2">정보 수정</h1>
                    </div>

                    <form th:action th:object="${member}" method="post">

                        <input type="hidden" th:field="*{memberId}">

                        <div class="mb-4">
                            <label class="form-label" th:for="loginId">아이디</label>
                            <input type="text" th:field="*{loginId}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('loginId')} ? 'is-invalid'"
                                   placeholder="변경할 아이디">
                            <div class="invalid-feedback" th:errors="*{loginId}">아이디 오류 메시지</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" th:for="nickname">닉네임</label>
                            <input type="text" th:field="*{nickname}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('nickname')} ? 'is-invalid'"
                                   placeholder="변경할 닉네임">
                            <div class="invalid-feedback" th:errors="*{nickname}">닉네임 오류 메시지</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" th:for="email">이메일</label>
                            <input type="email" th:field="*{email}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                   placeholder="example@study.com">
                            <div class="invalid-feedback" th:errors="*{email}">이메일 오류 메시지</div>
                        </div>

                        <div class="mb-5">
                            <label class="form-label" th:for="password">비밀번호 변경</label>
                            <input type="password" th:field="*{password}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                   placeholder="새 비밀번호">
                            <div class="invalid-feedback" th:errors="*{password}">비밀번호 오류 메시지</div>
                        </div>

                        <div class="d-grid gap-2">
                            <button class="btn btn-primary btn-lg fw-bold rounded-pill mb-2" type="submit">
                                정보 수정 완료
                            </button>
                            <a class="btn btn-outline-secondary btn-lg fw-bold rounded-pill" th:href="@{/}">
                                취소
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

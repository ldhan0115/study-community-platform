spring:
  datasource:
    url: jdbc:mysql://localhost:3307/study_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: study
    password: study_local_password
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      # 새 MySQL 연결의 행 잠금 대기 시간을 5초로 설정
      connection-init-sql: "SET SESSION innodb_lock_wait_timeout = 5"

  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
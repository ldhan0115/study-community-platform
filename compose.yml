name: study-community

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: study-community-platform:local

    # 앱까지 Docker로 실행할 때 활성화
    profiles: ["app"]

    ports:
      - "127.0.0.1:8081:8080"

    environment:
      SPRING_PROFILES_ACTIVE: prod

      # 같은 Compose 네트워크에서는 서비스 이름과 컨테이너 포트 사용
      DB_URL: "jdbc:mysql://mysql:3306/study_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
      DB_USERNAME: study
      DB_PASSWORD: study_local_password

      APP_SEED_ENABLED: "false"
      TZ: Asia/Seoul

    depends_on:
      mysql:
        condition: service_healthy

    # 실제 DB 조회를 수행하는 공개 페이지로 준비 상태 확인
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "3"
        - --output
        - /dev/null
        - "http://localhost:8080/studies?page=0&size=1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  mysql:
    image: mysql:8.4

    # 호스트의 3307 포트를 개발용 DB에 연결
    ports:
      - "127.0.0.1:3307:3306"

    environment:
      MYSQL_DATABASE: study_platform
      MYSQL_USER: study
      MYSQL_PASSWORD: study_local_password
      MYSQL_ROOT_PASSWORD: root_local_password
      TZ: Asia/Seoul

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_as_cs

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1"'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mysql-test:
    image: mysql:8.4

    profiles: ["test"]

    ports:
      - "127.0.0.1:3308:3306"

    environment:
      MYSQL_DATABASE: study_platform_test
      MYSQL_USER: study_test
      MYSQL_PASSWORD: study_test_password
      MYSQL_ROOT_PASSWORD: root_test_password
      TZ: Asia/Seoul

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_as_cs

    volumes:
      - mysql-test-data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1"'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql-data:
  mysql-test-data: